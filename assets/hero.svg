<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">
  <defs>
    <radialGradient id="orbGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect x="2" y="2" width="1196" height="376" rx="28" fill="#0D1117"/>
  <rect x="2" y="2" width="1196" height="376" rx="28" fill="url(#dots)"/>
  <!-- neon orbs behind glass -->
  <ellipse cx="215" cy="95" rx="200" ry="130" fill="url(#orbGreen)" filter="url(#soft)"/>
  <ellipse cx="985" cy="120" rx="220" ry="140" fill="url(#orbPurple)" filter="url(#soft)"/>
  <ellipse cx="600" cy="345" rx="280" ry="110" fill="url(#orbPink)" filter="url(#soft)"/>

  <!-- glass panel -->
  <rect x="90" y="62" width="1020" height="256" rx="24" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
  <rect x="90" y="62" width="1020" height="256" rx="24" fill="none" stroke="url(#edge)" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="130" y1="63.5" x2="1070" y2="63.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>

  <!-- glow text shadow -->
  <text x="600" y="168" text-anchor="middle" font-size="70" font-weight="800" letter-spacing="6" fill="#00FF9D" opacity="0.30" filter="url(#glow)">INSEKT_1024</text>
  <text x="600" y="168" text-anchor="middle" font-size="70" font-weight="800" letter-spacing="6"><tspan fill="#F2FFF8">INSEKT</tspan><tspan fill="#00FF9D">_1024</tspan></text>
  <text x="600" y="210" text-anchor="middle" font-size="21" letter-spacing="4" fill="#9AA4B2">SOFTWARE • WEB DEVELOPER — EN / FA — سلام دنیا</text>

  <!-- mini pills -->
  <g font-size="16" fill="#C9D1D9">
    <rect x="212" y="238" width="238" height="42" rx="21" fill="#FFFFFF" opacity="0.06"/>
    <rect x="212" y="238" width="238" height="42" rx="21" fill="none" stroke="#00FF9D" stroke-opacity="0.45"/>
    <circle cx="238" cy="259" r="6" fill="#00FF9D" filter="url(#glow)"/>
    <text x="342" y="265" text-anchor="middle">web dev since age 8</text>

    <rect x="466" y="238" width="238" height="42" rx="21" fill="#FFFFFF" opacity="0.06"/>
    <rect x="466" y="238" width="238" height="42" rx="21" fill="none" stroke="#7C3AED" stroke-opacity="0.6"/>
    <circle cx="492" cy="259" r="6" fill="#7C3AED" filter="url(#glow)"/>
    <text x="596" y="265" text-anchor="middle">Next.js + TypeScript</text>

    <rect x="720" y="238" width="238" height="42" rx="21" fill="#FFFFFF" opacity="0.06"/>
    <rect x="720" y="238" width="238" height="42" rx="21" fill="none" stroke="#FF007F" stroke-opacity="0.5"/>
    <circle cx="746" cy="259" r="6" fill="#FF007F" filter="url(#glow)"/>
    <text x="850" y="265" text-anchor="middle">self-hosted • 2^10</text>
  </g>

  <text x="600" y="350" text-anchor="middle" font-size="15" letter-spacing="5" fill="#5B6572">EGG → LARVA → PUPA → IMAGO → SWARM</text>
</svg>
